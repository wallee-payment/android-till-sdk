apply plugin: 'com.android.library'
apply plugin: 'maven-publish'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.dokka'

def sdkVersion = "2.3.0"

def currentGitBranch = getCurrentGitBranch()
def projectName = "Wallee Android Till SDK"

def resolvedBranch = (project.hasProperty("branch")
        ? project.getProperty("branch")
        : (System.getenv("CI_COMMIT_REF_NAME") ?: currentGitBranch ?: "unknown"))
        .trim()

def normalizedBranch = resolvedBranch.toLowerCase()
def isMasterBranch = (normalizedBranch == "master" || normalizedBranch.endsWith("/master"))
def isSnapshot = !isMasterBranch
def releaseVersionName = isSnapshot ? "${sdkVersion}-SNAPSHOT".toString() : sdkVersion.toString()

println "===== Wallee Till SDK build info ====="
println "sdkVersion          = '${sdkVersion}'"
println "currentGitBranch    = '${currentGitBranch}'"
println "CI_COMMIT_REF_NAME  = '${System.getenv("CI_COMMIT_REF_NAME")}'"
println "Gradle -Pbranch     = '${project.hasProperty("branch") ? project.getProperty("branch") : "N/A"}'"
println "resolvedBranch      = '${resolvedBranch}'"
println "normalizedBranch    = '${normalizedBranch}'"
println "isMasterBranch      = ${isMasterBranch}"
println "isSnapshot          = ${isSnapshot}"
println "releaseVersionName  = '${releaseVersionName}'"
println "======================================"

android {
    compileSdkVersion 29
    buildToolsVersion "29.0.3"

    defaultConfig {
        minSdkVersion 19
        targetSdkVersion 29
        versionCode 1
        versionName releaseVersionName

        manifestPlaceholders = [sdkVersion: sdkVersion]
        buildConfigField "String", "SDK_VERSION", "\"" + releaseVersionName + "\""
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation 'androidx.appcompat:appcompat:1.2.0'
    api 'com.google.code.gson:gson:2.8.6'
    implementation 'androidx.core:core-ktx:1.16.0'
    testImplementation 'junit:junit:4.13'
    androidTestImplementation 'androidx.test.ext:junit:1.1.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.3.0'
}

tasks.dokkaHtml {
    outputDirectory.set(layout.buildDirectory.dir("docs/javadoc"))

    dokkaSourceSets {
        named("main") {
            moduleName.set(projectName)
            displayName.set(projectName)
        }
    }
}

// Build a JAR with Dokka output (Java + Kotlin docs)
task javadocJar(type: Jar, dependsOn: dokkaHtml) {
    archiveClassifier.set('javadoc')
    from(layout.buildDirectory.dir("docs/javadoc"))
}

artifacts {
    archives javadocJar
}

afterEvaluate {
    // Esponi il branch come proprietà (come prima), ma usa quello risolto
    ext.branch = resolvedBranch

    println "===== Wallee Till SDK publishing info ====="
    println "Publishing from branch       = '${branch}'"
    println "isMasterBranch               = ${isMasterBranch}"
    println "Publishing version           = '${releaseVersionName}'"
    println "Will publish artifactId      = '${isMasterBranch ? "sdk" : "sdk-dev"}'"
    println "Component                    = '${isMasterBranch ? "release" : "debug"}'"
    println "==========================================="

    publishing {
        publications {
            if (isMasterBranch) {
                println 'Creating MavenPublication: releasePublication (master)'

                create("releasePublication", MavenPublication) {
                    from components.findByName('release')
                    groupId 'com.wallee.android.till'
                    artifactId 'sdk'
                    version releaseVersionName
                }

            } else {
                println 'Creating MavenPublication: snapshotPublication (non-master)'

                create("snapshotPublication", MavenPublication) {
                    from components.findByName('debug')
                    groupId 'com.wallee.android.till'
                    artifactId 'sdk-dev'
                    version releaseVersionName
                }
            }
        }
        repositories {
            maven {
                url "https://gitlab.wallee.com/api/v4/projects/263/packages/maven"
                name "GitLab"
                credentials(HttpHeaderCredentials) {
                    name = 'Job-Token'
                    value = System.getenv("CI_JOB_TOKEN")
                }
                authentication {
                    header(HttpHeaderAuthentication)
                }
            }
        }
    }
}

def getCurrentGitBranch() {
    def gitBranch = "Unknown branch"
    try {
        def workingDir = new File("${project.projectDir}")
        def result = 'git rev-parse --abbrev-ref HEAD'.execute(null, workingDir)
        result.waitFor()
        if (result.exitValue() == 0) {
            gitBranch = result.text.trim()
        }
    } catch (e) {
        println "Error getting git branch: ${e.message}"
    }
    return gitBranch
}
